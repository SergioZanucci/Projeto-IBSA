<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diaconato</title>
    <link rel="stylesheet" href="CSS/reset.css">
    <link rel="stylesheet" href="CSS/login-diaconato.css">
    <!-- Links para trazer os ícones via CDN -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/solid.css"/>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/fontawesome.css"/>
</head>
<body>
    <header>
        <section class="container-voltar">
            <a href="index.html" class="link-voltar-texto">
                <span class="fa fa-home"></span>
                <span>Voltar</span>
            </a>
        </section>
    </header>
    <main>
        <section class="container-login-diaconato">
            <form class="login-form-diaconato">
                <input type="text" name="email" placeholder="email" class="diaconato">
                <input type="password" name="senha" placeholder="senha" class="diaconato">
                <button type="submit" class="login-button-diaconato" disabled>Entrar</button>
                <p id="error-message" class="error"></p>
            </form>
            <p class="esqueci-senha-texto">Esqueceu sua senha?</p>
        </section>
    </main>
    
</body>
</html>
