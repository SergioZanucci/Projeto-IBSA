<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diaconato</title>
    <link rel="stylesheet" href="/CSS/reset.css">
    <link rel="stylesheet" href="/CSS/diaconato.css">
    <!-- Links para trazer os ícones via CDN -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/solid.css"/>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/fontawesome.css"/>
</head>
<body>
     <header>
        <section class="container-cabecalho">
            <section class="container-voltar">
                <a href="../index.html" class="link-voltar-texto">
                    <span class="fa fa-home"></span>
                    <span>Voltar</span>
                </a>
                <p class="cabecalho-departamento-texto">Diaconato</p>
            </section>
            <section class="container-foto-nome">
                <span>
                    <img src="/Imagem/person_check_24dp_E8EAED_FILL0_wght400_GRAD0_opsz24.png" alt="">
                </span>
                <span>Diac.</span>
            </section>
        </section>
    </header>

     <main>
        <section class="container-main">
            <section class="container-mensagem-texto">
                <h1>Olá Diac! Seja bem vindo. </h1>
                <span>Aqui estão suas proximas escalas no Diaconato:</span>
            </section>

            <section class="container-table-programacao">
                <table>
                    <h2>Proximas escalas</h2>
                    <thead class="cabecalho-programacao">
                        <tr>
                            <th class="texto-dia-mes-ano">Dia</th>
                            <th class="texto-dia-mes-ano">Mês</th>
                            <th class="texto-dia-mes-ano">Ano</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>20</td>
                            <td>Janeiro</td>
                            <td>2026</td>
                        </tr>

                        <tr>
                            <td>03</td>
                            <td>Fevereiro</td>
                            <td>2026</td>
                        </tr>
                        <tr>
                            <td class="horarios"><span class="mais">mais +</span></td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </section>

        <section class="container-table-diaconos">
            <table>
                <thead class="cabecalho-thead-diaconos"> 
                    <tr>
                        <th>Equipe diaconato</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="diaconos"><img src="#" alt="">Felipe Mendes<br>
                        <td class="diaconos"><img src="#" alt="">Rodrigo Alves</td>
                        <td class="diaconos"><img src="#" alt="">Aline Martin</td>
                        <td class="diaconos"><span class="mais">mais +5</span></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </section>  
    </main>
</body>
